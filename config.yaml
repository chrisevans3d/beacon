name: Beacon Lab
version: "1.40.1"
slug: beacon_lab
description: "Experimental family dashboard with weather, night-sky outlooks and scheduled screensavers"
url: "https://github.com/chrisevans3d/beacon"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 3000
panel_icon: mdi:calendar-clock
panel_title: Beacon Lab
homeassistant_api: true
auth_api: true
options:
  family_name: "My Family"
  save_config_in_browser: true
  theme: "skylight"
  auto_dark_mode: true
  weather_entity: "weather.home"
  photo_directory: "/media/beacon/photos"
  photo_interval: 30
  screen_saver_timeout: 5
schema:
  family_name: str
  save_config_in_browser: bool
  theme: str
  auto_dark_mode: bool
  weather_entity: str
  photo_directory: str
  photo_interval: int
  screen_saver_timeout: int
